<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US Map</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <form id="controls">
    <label for="n">N =</label>
    <input id="n" name="n" type="number" min="1" value="10" required>
    <label for="algorithm">Algorithm</label>
    <select id="algorithm" name="algorithm">
      <option value="dp">DP</option>
      <option value="annealing">Annealing</option>
    </select>
    <button type="submit" id="submit" disabled>Submit</button>
    <p id="status" role="status"></p>
  </form>
  <svg id="map" viewBox="0 0 1200 740" role="img" aria-label="Contiguous United States with state boundaries and cities; hover over a dot for its name">
    <image href="us-map.svg" width="1200" height="740"/>
    <g id="route"></g>
    <g id="points"></g>
  </svg>
</body>
</html>
